name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p project
          for z in *.zip; do
            echo "Unzipping: $z"
            unzip -o "$z" -d project
          done
          echo "---- files after unzip ----"
          find project -maxdepth 3 -type f | head -40

          ROOT=""
          if [ -f project/settings.gradle.kts ] || [ -f project/settings.gradle ]; then
            ROOT="project"
          else
            FOUND=$(find project -name "settings.gradle.kts" -o -name "settings.gradle" 2>/dev/null | head -1)
            if [ -n "$FOUND" ]; then
              ROOT=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$ROOT" ] || [ ! -d "$ROOT" ]; then
            echo "ERROR: Could not find Android project root"
            find project -type f | head -80
            exit 1
          fi

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Using root: $ROOT"
          ls -la "$ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create debug keystore
        working-directory: ${{ env.ROOT }}
        run: |
          keytool -genkeypair -v -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -alias androiddebugkey \
            -keystore debug.keystore \
            -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Build Debug APK
        working-directory: ${{ env.ROOT }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            curl -sL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/g.zip
            unzip -q /tmp/g.zip -d /tmp
            /tmp/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        id: find
        run: |
          APK=$(find . -path "*/outputs/apk/debug/*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            find . -name "*.apk" || true
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK"
          ls -lh "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dass-APK
          path: ${{ steps.find.outputs.apk }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dass APK v1.0.${{ github.run_number }}
          body: Download the APK from Assets below.
          files: ${{ steps.find.outputs.apk }}
